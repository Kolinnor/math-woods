<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Math Woods is restarting</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #e8e2d3;
        color: #1c211b;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }

      main {
        background: #fff;
        border: 1px solid #c7d2c5;
        border-top: 5px solid #2f704c;
        border-radius: 6px;
        box-shadow: 0 14px 36px rgb(36 45 35 / 0.12);
        max-width: 38rem;
        padding: clamp(1.75rem, 6vw, 3.25rem);
        width: 100%;
      }

      .brand {
        color: #2f704c;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 0 0 1.1rem;
        text-transform: uppercase;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 3.35rem);
        font-weight: 600;
        line-height: 1.05;
        margin: 0;
      }

      p {
        color: #4f5a50;
        font-size: 1.05rem;
        line-height: 1.65;
        margin: 1.25rem 0 0;
      }

      a {
        background: #2f704c;
        border: 1px solid #275f40;
        border-radius: 5px;
        color: #fff;
        display: inline-block;
        font-weight: 700;
        margin-top: 1.75rem;
        padding: 0.7rem 1rem;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #d2a63c;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Math Woods</p>
      <h1>Math Woods is restarting</h1>
      <p>The server is being restarted. This should take less than a minute. Please try again shortly.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
