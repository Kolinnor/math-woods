global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: math-woods-app
    metrics_path: /api/internal/metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["caddy:9180"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
